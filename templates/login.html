<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | RefurbTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #070b14; color: #f1f5f9; }
        .navbar { background: rgba(7, 11, 20, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 76px); padding: 20px; }
        .glass-card { background: #0d1526; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 50px; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6); width: 100%; max-width: 400px; text-align: center; }
        .form-control { background-color: #1a2436 !important; border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff !important; border-radius: 12px; padding: 15px; margin-bottom: 20px;}
        .form-control::placeholder { color: rgba(255, 255, 255, 0.5) !important; }
        .form-control:focus { border-color: #38bdf8; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.2); }
        .btn-premium { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); border: none; border-radius: 12px; color: #fff; font-weight: 800; padding: 15px; width: 100%; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark py-3">
        <div class="container text-white">
            <a href="/" class="navbar-brand fw-bold fs-4 text-decoration-none text-white">REFURB<span style="color:#38bdf8">TECH</span></a>
            <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
                <a href="/" class="btn btn-outline-light btn-sm"><i class="fas fa-home me-1"></i> Main Page</a>
                <a href="/customer_login" class="btn btn-outline-light btn-sm"><i class="fas fa-user me-1"></i> Customer Login</a>
                <a href="/dashboard" class="btn btn-outline-info btn-sm">View Inventory</a>
            </div>
        </div>
    </nav>
    <div class="login-wrapper">
        <div class="glass-card">
            <i class="fas fa-user-shield fs-1 text-info mb-3"></i>
            <h3 class="fw-bold text-white mb-1">Staff Portal</h3>
            <p class="small text-secondary mb-4 tracking-widest text-uppercase">Authorized Access Only</p>
            
            {% if error %}
                <div class="alert alert-danger py-2 small fw-bold">{{ error }}</div>
            {% endif %}
    
            <form method="POST">
                <input type="text" name="username" class="form-control" placeholder="Admin Username" required>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
                <button type="submit" class="btn btn-premium mt-2">Access Dashboard</button>
            </form>
            <a href="/" class="d-block mt-4 small text-info text-decoration-none"><i class="fas fa-arrow-left"></i> Back to Form</a>
        </div>
    </div>
</body>
</html>
